{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "payload-cms.fullname" . }}
  labels:
    {{- include "payload-cms.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`)
      priority: 10
      services:
        - name: {{ include "payload-cms.fullname" . }}
          port: {{ .Values.service.port }}
    {{- if .Values.ingressRoute.admin.basicAuth }}
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`) && Path(`/admin`)
      priority: 11
      middlewares:
        - name: {{ .Values.ingressRoute.admin.basicAuthSecret }}
      services:
        - name: {{ include "payload-cms.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
{{- end }}
