site_name: payload-cms
site_author: Andrew Thomas Lee
site_url: https://docs.bff.netsam.dev
repo_url: https://github.com/andrewthomaslee/payload-cms
repo_name: andrewthomaslee/payload-cms

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/index.md
      - Branching: architecture/branching.md
      - CI/CD: architecture/ci-cd.md
      - WARP + Tunnel: architecture/warp-tunnel.md
      - Manual GitHub Setup: architecture/github-setup.md
  - Helm:
      - Chart values: helm/chart-values.md
      - Environments: helm/environments.md
  - Decisions:
      - Overview: decisions/index.md
      - ADR 0001 - Helm over Kustomize: decisions/0001-helm-over-kustomize.md
      - ADR 0002 - Promote over Rebuild: decisions/0002-promote-over-rebuild.md
      - ADR 0003 - Single Cluster: decisions/0003-single-cluster.md
      - ADR 0004 - Manual-only CI: decisions/0004-manual-only-ci.md

plugins:
  - search

markdown_extensions:
  - attr_list

theme:
  font: false
  language: en
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.select
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  palette:
    # Palette toggle for automatic mode
    - media: '(prefers-color-scheme)'
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: '(prefers-color-scheme: light)'
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: '(prefers-color-scheme: dark)'
      primary: grey
      accent: blue
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
