apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: payload-cms-manifests-dev
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/andrewthomaslee/payload-cms/kustomization/dev
  ref:
    semver: '>=0.1.0'
  # Enable when the kustomization artifact is private:
  # secretRef:
  #   name: ghcr-pull-secret
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payload-cms-dev
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: payload-cms-manifests-dev
