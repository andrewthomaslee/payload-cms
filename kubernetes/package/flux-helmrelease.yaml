apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb
spec:
  interval: 168h
  releaseName: mongodb
  chartRef:
    kind: OCIRepository
    name: bitnami-mongodb
  values:
    useStatefulSet: true
    architecture: standalone
    auth:
      enabled: true
    pdb:
      create: false
    resources:
      requests:
        cpu: 1
        memory: 256Mi
      limits:
        cpu: 4
        memory: 8Gi
    mcp:
      enabled: true
      updateStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 1
          memory: 2Gi