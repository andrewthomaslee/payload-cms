namespace: payload-cms
resources:
  - ../../package
  - sealed-auth-secret.yaml
  - env-sealed-secret.yaml
labels:
  - pairs:
      io.kompose.service: payload-cms
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: payload-cms
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`bff.andrewlee.fun`)"
      - op: replace
        path: /spec/routes/1/match
        value: "Host(`bff.andrewlee.fun`) && Path(`/admin`)"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: payload-cms
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "ghcr.io/andrewthomaslee/payload-cms/site/home:latest"
