namespace: payload-cms
resources:
  - ../../package
  - sealed-auth-secret.yaml
  - env-sealed-secret.yaml
labels:
  - pairs:
      env: production
      cluster: hcloud
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: payload-cms
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: "Host(`payload-cms.netsam.dev`)"
      - op: replace
        path: /spec/routes/1/match
        value: "Host(`payload-cms.netsam.dev`) && Path(`/admin`)"
