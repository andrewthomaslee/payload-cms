name: release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which kustomization artifact to push'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  push-kustomization:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get Commit Count
        id: vars
        run: echo "commit_count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build kustomization
        run: |
          nix build ".#packages.x86_64-linux.kustomize-${{ inputs.environment }}" \
            --out-link result --show-trace
          mkdir -p dist
          cp result dist/resources.yaml
          cat > dist/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - resources.yaml
          EOF

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push kustomization OCI artifact
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ARTIFACT="ghcr.io/${OWNER_LOWER}/payload-cms/kustomization/${{ inputs.environment }}"
          flux push artifact "oci://${ARTIFACT}" \
            --path ./dist \
            --source "$(git config --get remote.origin.url)" \
            --revision "$(git branch --show-current)@sha1:$(git rev-parse HEAD)" \
            --tag "0.1.${{ steps.vars.outputs.commit_count }}" \
            --tag latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the artifact with GitHub OIDC Token
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ARTIFACT="ghcr.io/${OWNER_LOWER}/payload-cms/kustomization/${{ inputs.environment }}"
          DIGEST=$(crane digest "${ARTIFACT}:latest" || true)
          if [ -z "$DIGEST" ]; then
            DIGEST=$(crane digest "${ARTIFACT}:0.1.${{ steps.vars.outputs.commit_count }}")
          fi
          cosign sign --yes "${ARTIFACT}@${DIGEST}"

  flakehub:
    needs: push-kustomization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Publish to FlakeHub
        uses: DeterminateSystems/flakehub-push@main
        with:
          visibility: private
          name: andrewthomaslee/payload-cms
          include-output-paths: true
          rolling: true
          rolling-minor: 1
