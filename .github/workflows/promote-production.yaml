name: promote-production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dev image tag to promote (e.g. 0.1.42)'
        required: true
        type: string

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ inputs.tag }}"
          echo "$TAG" | grep -Eq '^0\.1\.[0-9]+$' || {
            echo "Tag must match 0.1.<N>, got: $TAG"
            exit 1
          }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: google/go-containerregistry@main
        with:
          crane_version: v0.20.3

      - name: Copy dev image digest to production repo
        env:
          DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/payload-cms/site/dev:${{ inputs.tag }}
          PROD_REPO: ghcr.io/${{ github.repository_owner }}/payload-cms/site/production
        run: |
          crane copy "$DEV_IMAGE" "${PROD_REPO}:${{ inputs.tag }}"
          crane tag "${PROD_REPO}:${{ inputs.tag }}" latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the promoted image with GitHub OIDC Token
        env:
          PROD_REPO: ghcr.io/${{ github.repository_owner }}/payload-cms/site/production
        run: |
          DIGEST=$(crane digest "${PROD_REPO}:${{ inputs.tag }}")
          cosign sign --yes "${PROD_REPO}@${DIGEST}"
